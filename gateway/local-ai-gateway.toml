[server]
host = "0.0.0.0"
port = 8766

[paths]
# macOS/Linux: prefira manter o tokens.json dentro do repo (ele já está no .gitignore)
tokens_file = "gateway/tokens.json"
# OBS: este caminho é usado só pelo fluxo Codex; Claude Code não depende dele.
codex_env_file = "~/.codex/.env"

[timeouts]
upstream_read_seconds = 150
upstream_non_streaming_read_seconds = 280
upstream_queue_seconds = 90
stream_retry_delay_seconds = 1
token_refresh_buffer_seconds = 300

[limits]
upstream_max_concurrent_requests = 4
main_request_min_bytes = 102400
stream_ping_interval_seconds = 15
stream_max_attempts = 2

